name: Release

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'

permissions:
    contents: write

jobs:
    build-release:
        runs-on: macos-latest
        if: startsWith(github.ref, 'refs/tags/v')

        outputs:
            version: ${{ steps.get-version.outputs.version }}
            zip-name: ${{ steps.get-version.outputs.zip-name }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Get version from tag
              id: get-version
              run: |
                  VERSION=${GITHUB_REF#refs/tags/}
                  ZIP_NAME="you-up-${VERSION}"
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "zip-name=${ZIP_NAME}" >> $GITHUB_OUTPUT
                  echo "Version: ${VERSION}"
                  echo "Zip Name: ${ZIP_NAME}"

            - name: Validate semantic version
              run: |
                  VERSION=${{ steps.get-version.outputs.version }}
                  if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Error: Tag '$VERSION' does not follow semantic versioning (v#.#.#)"
                    exit 1
                  fi
                  echo "✅ Version $VERSION is valid semantic version"

            - name: Setup Swift
              uses: swift-actions/setup-swift@v2
              with:
                  swift-version: '6.1'

            - name: Display Swift version
              run: swift --version

            - name: Display system info
              run: |
                  xcode-select --print-path
                  uname -m

            - name: Cache Swift packages
              uses: actions/cache@v4
              with:
                  path: .build
                  key: release-macos-swift-6.1-${{ hashFiles('Package.swift', 'Package.resolved') }}
                  restore-keys: |
                      release-macos-swift-6.1-
                      release-macos-swift-

            - name: Build Universal Binary (x86_64)
              run: swift build -c release --arch x86_64

            - name: Build Universal Binary (arm64)
              run: swift build -c release --arch arm64

            - name: Debug build directories
              run: |
                  echo "Build directory structure:"
                  find .build -name "you-up-cli" 2>/dev/null || true
                  echo "All build directories:"
                  ls -la .build/ || true
                  echo "x86_64 directory contents:"
                  ls -la .build/x86_64-apple-macosx*/release/ 2>/dev/null || true
                  echo "arm64 directory contents:"
                  ls -la .build/arm64-apple-macosx*/release/ 2>/dev/null || true

            - name: Create Universal Binary
              run: |
                  mkdir -p .build/universal
                  # Find the you-up-cli executable (the actual executable name from Package.swift)
                  X86_EXEC=$(find .build -path "*x86_64*release*" -name "you-up-cli" | head -1)
                  ARM_EXEC=$(find .build -path "*arm64*release*" -name "you-up-cli" | head -1)

                  echo "x86_64 executable: $X86_EXEC"
                  echo "arm64 executable: $ARM_EXEC"

                  if [[ -z "$X86_EXEC" || -z "$ARM_EXEC" ]]; then
                    echo "Error: Could not find you-up-cli executables"
                    echo "Available files:"
                    find .build -type f -executable 2>/dev/null || true
                    exit 1
                  fi

                  # Create universal binary with final name 'you-up' for distribution
                  lipo -create "$X86_EXEC" "$ARM_EXEC" -output .build/universal/you-up

            - name: Verify Universal Binary
              run: |
                  file .build/universal/you-up
                  lipo -info .build/universal/you-up

            - name: Create Bill of Materials
              run: |
                  BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
                  VERSION=${{ steps.get-version.outputs.version }}
                  cat > BUILDINFO.md << EOF
                  # Build Information

                  This file contains the Bill of Materials (BoM) for this you-up release.

                  ## Release Details

                  | Field | Value |
                  |-------|-------|
                  | **Version** | ${VERSION} |
                  | **Release Date** | ${BUILD_DATE} |
                  | **Git SHA** | ${{ github.sha }} |
                  | **Git Branch** | ${{ github.ref_name }} |
                  | **Repository** | ${{ github.repository }} |
                  | **Workflow** | ${{ github.workflow }} |
                  | **Runner OS** | macOS Latest |
                  | **Swift Version** | 6.1 |
                  | **Architecture** | Universal (x86_64 + arm64) |
                  | **Release Type** | Production Release |

                  ## Files Included

                  - \`you-up\` - Universal macOS binary
                  - \`README.md\` - Project documentation
                  - \`LICENSE\` - MIT License file
                  - \`BUILDINFO.md\` - This build information file
                  EOF

            - name: Create Release Archive
              run: |
                  mkdir -p release
                  cp .build/universal/you-up release/
                  cp README.md release/
                  cp LICENSE release/
                  cp BUILDINFO.md release/
                  cd release
                  zip -r ${{ steps.get-version.outputs.zip-name }}.zip .
                  mv ${{ steps.get-version.outputs.zip-name }}.zip ../

            - name: Upload Release Archive
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.get-version.outputs.zip-name }}
                  path: ${{ steps.get-version.outputs.zip-name }}.zip
                  retention-days: 365

    create-github-release:
        needs: build-release
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download Release Archive
              uses: actions/download-artifact@v4
              with:
                  name: ${{ needs.build-release.outputs.zip-name }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: you-up ${{ needs.build-release.outputs.version }}
                  tag_name: ${{ needs.build-release.outputs.version }}
                  prerelease: false
                  generate_release_notes: true
                  files: ${{ needs.build-release.outputs.zip-name }}.zip
                  body: |
                      ## You Up ${{ needs.build-release.outputs.version }}

                      Production release of you-up.

                      ### What's Included
                      - Universal macOS binary (x86_64 + arm64)
                      - Complete documentation
                      - Build information and Bill of Materials

                      ### Installation
                      1. Download and extract the zip file
                      2. Copy `you-up` to a directory in your PATH (e.g., `/usr/local/bin/`)
                      3. Make it executable: `chmod +x /usr/local/bin/you-up`

                      ### Usage
                      See the included README.md for detailed configuration instructions.

                      **Release Information:**
                      - Version: ${{ needs.build-release.outputs.version }}
                      - Commit: ${{ github.sha }}
                      - Universal Binary: x86_64 + arm64
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
